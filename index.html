<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Simulador Las Moreras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: una columna estrecha y legible, barra de fases arriba, tarjetas solo para lo que se toca. Paleta de bistró: verde botella y latón sobre blanco mármol. */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --ink:#1d2622; --muted:#5a6660; --line:#d9ded9;
  --accent:#1e5b4a; --accent-ink:#ffffff; --accent-soft:#e1eee8; --brass:#b5832a; --brass-soft:#f6ecd8;
  --ok:#2c7a3f; --ok-soft:#e3f2e6; --bad:#b3362c; --bad-soft:#f8e3e0; --warn:#8a5a00; --warn-soft:#fbf0d6;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-display:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1b2420; --ink:#e9eee9; --muted:#a3b0a9; --line:#2f3b35;
  --accent:#5fbf9f; --accent-ink:#0d1a15; --accent-soft:#1f3a31; --brass:#e0b45a; --brass-soft:#3a2f18;
  --ok:#6fcf86; --ok-soft:#1d3524; --bad:#f08a7e; --bad-soft:#3d211e; --warn:#f2c46a; --warn-soft:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1b2420; --ink:#e9eee9; --muted:#a3b0a9; --line:#2f3b35;
  --accent:#5fbf9f; --accent-ink:#0d1a15; --accent-soft:#1f3a31; --brass:#e0b45a; --brass-soft:#3a2f18;
  --ok:#6fcf86; --ok-soft:#1d3524; --bad:#f08a7e; --bad-soft:#3d211e; --warn:#f2c46a; --warn-soft:#3a2f17; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);font-weight:700}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-block:8px 4px}
.brand small{display:block;font-size:.85rem;color:var(--muted)}
.mode{display:flex;border:2px solid var(--accent);border-radius:999px;overflow:hidden}
.mode button{border:0;background:transparent;color:var(--accent);padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.phases{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-block:12px 20px}
nav.phases button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 4px;font:inherit;font-size:.82rem;cursor:pointer;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
nav.phases button b{font-family:var(--font-display);font-size:1.15rem}
nav.phases button[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
nav.phases button.done b::after{content:" ✓";color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;min-height:52px;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:40px;padding:6px 12px;font-size:.95rem}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.check:focus-within{outline:3px solid var(--brass);outline-offset:2px}
.next{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
/* checklists */
.checklist{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
label.check{display:flex;gap:14px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
label.check input{width:28px;height:28px;flex:none;accent-color:var(--accent);margin:0}
label.check:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--ok);transition:width .25s}
@media (prefers-reduced-motion: reduce){.progress span{transition:none}}
/* carta */
.menu-group{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.item .price{font-variant-numeric:tabular-nums;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:700}
.tag.none{background:var(--ok-soft);color:var(--ok)}
.add{width:48px;height:48px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:1.6rem;font-weight:700;cursor:pointer;line-height:1}
.order{border:2px dashed var(--brass);background:var(--brass-soft);border-radius:var(--r);padding:16px}
.order-line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.qty{display:flex;gap:6px;align-items:center}
.qty button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.2rem;cursor:pointer}
select,input[type=text],input[type=number],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:50px;width:100%}
textarea{min-height:90px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.note{border-radius:10px;padding:14px 16px;border-left:6px solid var(--brass);background:var(--brass-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
/* incidencias */
.quote{font-family:var(--font-display);font-size:1.35rem;font-weight:600;line-height:1.3}
.options{display:flex;flex-direction:column;gap:10px}
.option{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:14px 16px;font:inherit;cursor:pointer;min-height:56px}
.option.right{border-color:var(--ok);background:var(--ok-soft)}
.option.wrong{border-color:var(--bad);background:var(--bad-soft)}
.option:disabled{cursor:default;color:var(--ink)}
/* resumen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.stat b{display:block;font-family:var(--font-display);font-size:1.8rem;font-variant-numeric:tabular-nums}
/* docente */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.rubric{display:flex;flex-direction:column;gap:14px}
.crit{display:flex;flex-direction:column;gap:8px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.level{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 6px;font:inherit;font-size:.95rem;font-weight:700;cursor:pointer;min-height:52px}
.level[aria-pressed="true"][data-v="1"]{border-color:var(--bad);background:var(--bad-soft)}
.level[aria-pressed="true"][data-v="2"]{border-color:var(--brass);background:var(--brass-soft)}
.level[aria-pressed="true"][data-v="3"]{border-color:var(--ok);background:var(--ok-soft)}
.crit details{font-size:.9rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--surface)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;text-align:center}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:700;font-size:.8rem}
.pill.l1{background:var(--bad-soft);color:var(--bad)}
.pill.l2{background:var(--brass-soft);color:var(--warn)}
.pill.l3{background:var(--ok-soft);color:var(--ok)}
.student-list{display:flex;flex-direction:column;gap:6px;list-style:none;padding:0;margin:0}
.student-list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:10px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.confirm-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:520px){
  body{font-size:17px}
  nav.phases{grid-template-columns:repeat(3,minmax(0,1fr))}
  h1{font-size:1.55rem}
}

nav.phases{grid-template-columns:repeat(8,minmax(0,1fr))}
nav.phases button{position:relative}
nav.phases .badge{position:absolute;top:4px;right:4px;min-width:20px;height:20px;border-radius:999px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.wrap{max-width:980px}
.tables{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.table-btn{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 6px;font:inherit;cursor:pointer;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.table-btn b{font-family:var(--font-display);font-size:1.1rem}
.table-btn small{font-size:.78rem;color:var(--muted)}
.table-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.table-btn.busy small{color:var(--warn);font-weight:700}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ticket{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ticket.st-nuevo{border-color:var(--bad)}
.ticket.st-recibido{border-color:var(--brass)}
.ticket.st-prep{border-color:var(--accent)}
.ticket.st-listo{border-color:var(--ok);background:var(--ok-soft)}
.ticket header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ticket header b{font-family:var(--font-display);font-size:1.15rem}
.ticket ul{margin:0;padding-left:1.1em}
.state{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.state.nuevo{background:var(--bad-soft);color:var(--bad)}
.state.recibido{background:var(--brass-soft);color:var(--warn)}
.state.prep{background:var(--accent-soft);color:var(--accent)}
.state.listo,.state.servido{background:var(--ok-soft);color:var(--ok)}
.obs{font-size:.9rem;padding:6px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:700}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem;background:var(--surface);border:1px dashed var(--muted);border-radius:6px;padding:14px;line-height:1.45;max-width:380px}
.receipt .r{display:flex;justify-content:space-between;gap:10px}
.receipt hr{border:0;border-top:1px dashed var(--muted);margin:6px 0}
.money{display:flex;flex-wrap:wrap;gap:6px}
.money button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-weight:700;cursor:pointer;min-height:44px;font-variant-numeric:tabular-nums}
.money button.bill{border-color:var(--accent)}
.pos{background:#1c2320;color:#e9f1ec;border-radius:18px;padding:18px;max-width:340px;display:flex;flex-direction:column;gap:12px;border:3px solid #3a4741}
.pos .screen{background:#bcd3c4;color:#10201a;border-radius:8px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:84px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.pos .screen b{font-size:1.4rem}
.pos .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pos .keys button{background:#2e3833;color:#fff;border:0;border-radius:8px;min-height:44px;font:inherit;font-weight:700;cursor:pointer}
.pos .keys button.ok{background:#2c7a3f}
.pos .keys button.ko{background:#b3362c}
.pos .actions{display:flex;flex-direction:column;gap:6px}
.pos .actions button{background:#2e3833;color:#fff;border:1px solid #4b5a52;border-radius:10px;min-height:46px;font:inherit;font-weight:700;cursor:pointer}
.kv{display:grid;grid-template-columns:auto auto;gap:4px 16px;justify-content:start;font-variant-numeric:tabular-nums}
.kv b{text-align:right}
.members{display:flex;flex-direction:column;gap:8px}
.member{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.member select{min-height:44px;padding:6px 8px;width:auto}
.rotbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-weight:700}
@media (max-width:760px){
  nav.phases{grid-template-columns:repeat(5,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
  .tables{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  nav.phases{grid-template-columns:repeat(3,minmax(0,1fr))}
  .member{grid-template-columns:minmax(0,1fr) auto;}
}
.sync-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);margin-right:8px;vertical-align:middle}
.sync-dot[data-state="ok"]{background:var(--ok)}
.sync-dot[data-state="lost"]{background:var(--bad)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">HOTR0208 · Bistró-cafetería</div>
      <h1>Las Moreras</h1>
      <small>TPV de simulación · servicio de mediodía</small>
    </div>
    <div class="mode" id="modeSwitch" hidden>
      <button type="button" id="modeStudent" aria-pressed="true">Simulación</button>
      <button type="button" id="modeTeacher" aria-pressed="false">Docente</button>
    </div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"></script>
<script>window.MORERAS_FIREBASE = {"databaseURL":"https://las-moreras-default-rtdb.europe-west1.firebasedatabase.app","projectId":"las-moreras"};</script>
<script>
"use strict";
/* =========================================================
   Las Moreras · TPV de simulación por servicios (versión 3)
   Todo el estado vive en este dispositivo (localStorage).
   ========================================================= */

/* ---------- Contenido ---------- */
const CARTA = {
  "Bebidas": [
    {id:"solo", n:"Café solo", p:1.30, a:[], st:"barra"},
    {id:"cortado", n:"Cortado", p:1.40, a:["Lácteos"], st:"barra"},
    {id:"conleche", n:"Café con leche", p:1.60, a:["Lácteos"], st:"barra"},
    {id:"infusion", n:"Infusión", p:1.50, a:[], st:"barra"},
    {id:"agua", n:"Agua mineral", p:1.50, a:[], st:"barra"},
    {id:"refresco", n:"Refresco", p:2.20, a:[], st:"barra"},
    {id:"cana", n:"Caña de cerveza", p:2.00, a:["Gluten"], st:"barra"},
    {id:"sinalcohol", n:"Cerveza sin alcohol", p:2.20, a:["Gluten"], st:"barra"},
    {id:"zumo", n:"Zumo de naranja natural", p:2.80, a:[], st:"barra"},
    {id:"batido", n:"Batido de plátano y fresa", p:3.20, a:["Lácteos"], st:"barra"}
  ],
  "Comidas": [
    {id:"tostada", n:"Tostada con tomate y aceite", p:2.50, a:["Gluten"], st:"cocina"},
    {id:"tortilla", n:"Pincho de tortilla de patatas", p:3.00, a:["Huevo"], st:"cocina"},
    {id:"bizcocho", n:"Bizcocho casero", p:3.00, a:["Gluten","Huevo","Lácteos"], st:"cocina"},
    {id:"fruta", n:"Fruta de temporada", p:2.50, a:[], st:"cocina"},
    {id:"sandwich", n:"Sándwich mixto", p:4.00, a:["Gluten","Lácteos"], st:"cocina"},
    {id:"ensalada", n:"Ensalada mixta", p:6.50, a:["Huevo","Pescado"], st:"cocina"},
    {id:"quesos", n:"Tabla de quesos con nueces", p:8.00, a:["Lácteos","Frutos de cáscara"], st:"cocina"}
  ]
};
const ITEMS = Object.values(CARTA).flat();
const item = id => ITEMS.find(i=>i.id===id);
const ALERGENOS = ["Gluten","Lácteos","Huevo","Pescado","Frutos de cáscara"];
const MESAS = ["Mesa 1","Mesa 2","Mesa 3","Barra"];
const ROLES = {sala:"Sala", barra:"Barra", cocina:"Cocina / Pase", clientes:"Clientes / Observadores"};
const IVA = 0.10;
const EMPRESA = {nombre:"Las Moreras · Bistró-cafetería", nif:"B00000000 (ficticio)", dir:"Centro de Formación · Monesterio (Badajoz)"};

const FASE_A = [
  {g:"Higiene personal", items:["Llevo el uniforme limpio y completo.","Me he lavado las manos.","Llevo el pelo recogido y no llevo anillos, pulseras ni reloj."]},
  {g:"Puesto de trabajo y menaje", items:["Hemos desinfectado la barra, las mesas y el pase de cocina con un producto autorizado.","Hemos revisado que la vajilla, la cristalería y la cubertería estén limpias, secas y sin desperfectos.","Cogemos las copas por el pie y los cubiertos por el mango.","La cafetera está encendida y purgada."]},
  {g:"Montaje de sala y barra", items:["Las 3 mesas están montadas con mantel o individual, cubiertos, servilleta y copa.","Hay cartas limpias y comanderos preparados.","La barra está repuesta: azúcar, removedores, servilletas, hielo limpio y fruta."]},
  {g:"TPV, caja y datáfono", items:["Hemos comprobado que el TPV funciona y que sala, barra y cocina saben dónde ver sus notas de pedido.","Hemos contado el cambio inicial de la caja y coincide con el que indica el TPV.","Hemos comprobado que el datáfono de prácticas está listo."]}
];
const FASE_D = ["Nos hemos despedido de los clientes y hemos preguntado si todo ha estado a su gusto.","Hemos recogido y desbarasado mesas y barra.","Hemos limpiado y desinfectado equipos, barra, sala y pase con productos autorizados.","Hemos separado los residuos en sus contenedores.","Hemos repuesto los stocks mínimos para el siguiente turno.","Hemos hecho el arqueo y comprobado los tiques frente a la caja."];


/* ---------- Utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round(n*100)/100;
const eur = n => r2(n).toFixed(2).replace(".", ",") + " €";
const num = s => { const v = parseFloat(String(s).replace(",", ".")); return isNaN(v) ? NaN : r2(v); };
const today = () => new Date().toISOString().slice(0,10);
const hhmm = t => new Date(t).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
const mins = t => Math.max(0, Math.round((Date.now()-t)/60000));
const fmtDate = s => { const [y,m,d] = String(s).split("-"); return d ? `${d}/${m}/${y}` : s; };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); }
function load(key, fallback){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; } }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- Estado del turno (este dispositivo) ---------- */
const ROLE_ORDER = ["sala","barra","cocina","clientes"];
const autoRole = (gi, rot) => ROLE_ORDER[(gi + rot - 1) % 4];
const PUESTOS_SERV = ["sala","barra","cocina"];
const freshGroups = () => PUESTOS_SERV.map(k=>({id:k, name:ROLES[k], members:[], roles:{1:k}}));
const FRESH = () => ({v:3, step:0, team:"", groups:freshGroups(), nRot:1, rot:1, caja:100, a:[], d:[],
  orders:[], nOrder:0, tickets:[], nTicket:0, cashErr:0, cardDenied:0,
  arqueo:null, fecha:today()});
let S = Object.assign(FRESH(), load("moreras-tpv", {}));
if(S.v!==3) S = FRESH();
const persist = () => save("moreras-tpv", S);
const blankDraft = mesa => ({mesa, lines:{}, notas:{}, obs:"", stage:"menu", asked:null, allergies:[]});
let draft = blankDraft("Mesa 1");
let pay = null; // estado del cobro en curso
let mode = "alumno";

const STEPS = [
  ["equipo","Servicio","·"],["a","Preparar","A"],["sala","Sala","B"],["barra","Barra","B"],["cocina","Cocina","B"],
  ["caja","Caja","C"],["d","Cierre","D"],["resumen","Resumen","✓"]];

/* ---------- Derivados ---------- */
const lineStation = l => item(l.pid).st;
function orderStations(o){ return [...new Set(o.lines.map(lineStation))]; }
function openOrders(mesa){ return S.orders.filter(o=>o.mesa===mesa && !o.paid); }
function mesaTotal(mesa){ return r2(openOrders(mesa).reduce((s,o)=>s+o.lines.reduce((t,l)=>t+item(l.pid).p*l.q,0),0)); }
function pending(st){ return S.orders.filter(o=>o.st[st] && o.st[st]!=="listo" && o.st[st]!=="servido").length; }
function aggLines(orders){
  const m = {};
  orders.forEach(o=>o.lines.forEach(l=>{ m[l.pid]=(m[l.pid]||0)+l.q; }));
  return Object.entries(m).map(([pid,q])=>({pid,q,n:item(pid).n,p:item(pid).p,imp:r2(item(pid).p*q)}));
}
function ivaSplit(total){ const base = r2(total/(1+IVA)); return {base, iva:r2(total-base), total:r2(total)}; }
function rolesOf(rot){ const by={}; S.groups.forEach(g=>{ const r=g.roles[rot]; if(r) (by[r]=by[r]||[]).push(g.name); }); return by; }
const groupsReady = () => S.groups.every(g=>g.members.length>0);
const whoLine = () => S.groups.filter(g=>g.members.length).map(g=>`${esc(g.name)}: ${g.members.map(esc).join(", ")}`).join(" · ");

/* ---------- Render principal ---------- */
function render(){
  const ms=$("#modeStudent"), mt=$("#modeTeacher");
  if(ms){ ms.setAttribute("aria-pressed", mode==="alumno"); mt.setAttribute("aria-pressed", mode==="docente"); }
  if(mode==="docente" && typeof renderTeacher==="function"){ $("#app").innerHTML = renderTeacher(); return; }
  const badges = {barra:pending("barra"), cocina:pending("cocina")};
  const allowed = SYNC.on ? STEPS_BY_PUESTO[L.puesto] : null;
  const nav = `<nav class="phases" aria-label="Pantallas del TPV" ${allowed?'style="grid-template-columns:repeat('+(allowed.length+1)+',minmax(0,1fr))"':''}>${STEPS.map(([k,n,l],i)=>(allowed && k!=="equipo" && !allowed.includes(k))?"":`<button type="button" data-go="${i}" ${S.step===i?'aria-current="step"':''}><b>${l}</b>${n}${badges[k]?`<span class="badge" aria-label="${badges[k]} pendientes">${badges[k]}</span>`:''}</button>`).join("")}</nav>`;
  const rb = groupsReady() ? `<div class="rotbar">Servicio abierto<span class="muted" style="font-weight:400">${whoLine()}</span></div>` : "";
  const views = {equipo:vEquipo, a:vFaseA, sala:vSala, barra:()=>vStation("barra"), cocina:()=>vStation("cocina"), caja:vCaja, d:vCierre, resumen:vResumen};
  $("#app").innerHTML = nav + `<section class="stack">${syncBar()}${S.step>0?rb:""}${views[STEPS[S.step][0]]()}</section>`;
}
function go(k){ S.step = STEPS.findIndex(s=>s[0]===k); persist(); render(); window.scrollTo({top:0}); }

/* ---------- Equipo ---------- */
function vEquipo(){
  if(SYNC.on && L.puesto!=="todo") return vConexion();
  return `${vConexion()}<div class="card stack">
    <div><div class="eyebrow">Antes de empezar</div><h2>Abrir el servicio</h2></div>
    <p>Escribid quién está en cada puesto durante este servicio. Al terminar, cerrad el servicio y enviad el código de resultados al docente.</p>
    <label class="field"><span>Nombre del servicio (opcional)</span><input type="text" id="teamName" value="${esc(S.team)}" placeholder="Ej.: Servicio 1 · mañana"></label>
    <div class="stack" style="gap:12px">${S.groups.map(g=>`<div class="card stack" style="padding:14px">
      <div class="row" style="justify-content:space-between"><h3>${esc(g.name)}</h3><span class="muted">${g.members.length} alumno${g.members.length===1?'':'s'}</span></div>
      ${g.members.length?`<div class="chips">${g.members.map((m,i)=>`<button type="button" class="chip" data-delmember="${g.id}" data-i="${i}" aria-label="Quitar a ${esc(m)}">${esc(m)} ✕</button>`).join("")}</div>`:''}
      <div class="row"><input type="text" data-newmember="${g.id}" placeholder="Nombre y apellido" style="flex:1;min-width:0"><button type="button" class="btn small" data-addmember="${g.id}">Añadir</button></div>
    </div>`).join("")}</div>
    <label class="field"><span>Cambio inicial en caja (€)</span><input type="text" inputmode="decimal" id="cajaIni" value="${String(S.caja).replace(".",",")}"></label>
  </div>
  ${groupsReady()?'':'<p class="muted">Añadid al menos un alumno en Sala, Barra y Cocina para abrir el servicio.</p>'}
  <div class="next"><span></span><button type="button" class="btn" data-goto="a" ${groupsReady()?'':'disabled'}>Abrir el servicio</button></div>`;
}

/* ---------- Fase A ---------- */
function checklist(list, sel, key){
  return `<ul class="checklist">${list.map(t=>`<li><label class="check"><input type="checkbox" data-check="${key}" value="${esc(t)}" ${sel.includes(t)?'checked':''}><span>${esc(t)}</span></label></li>`).join("")}</ul>`;
}
function bar(n,total){ return `<span class="muted">${n} de ${total} hechos</span><div class="progress" aria-hidden="true"><span style="width:${total?Math.round(n/total*100):0}%"></span></div>`; }
function vFaseA(){
  const total = FASE_A.reduce((n,g)=>n+g.items.length,0);
  return `<div><div class="eyebrow">Fase A</div><h2>Preservicio, higiene y puesta a punto</h2></div>
    <p>Marcad cada punto cuando lo hayáis hecho de verdad en el aula-taller. El cambio inicial de la caja es <b>${eur(S.caja)}</b>.</p>${bar(S.a.length,total)}
    ${FASE_A.map(g=>`<div class="stack" style="gap:8px"><h3>${g.g}</h3>${checklist(g.items,S.a,"a")}</div>`).join("")}
    <div class="next"><button type="button" class="btn ghost" data-goto="equipo">Volver</button><button type="button" class="btn" data-goto="sala">Abrir la sala</button></div>`;
}

/* ---------- Sala (toma de comandas) ---------- */
function allergenTags(a){ return a.length? a.map(x=>`<span class="tag">${x}</span>`).join("") : `<span class="tag none">Sin alérgenos</span>`; }
function stateLabel(s){ return {nuevo:"Enviada",recibido:"Recibida",prep:"En preparación",listo:"Lista para pase",servido:"Servida"}[s]||s; }
function vSala(){
  const tables = `<div class="tables">${MESAS.map(m=>{ const o=openOrders(m); const t=mesaTotal(m);
    return `<button type="button" class="table-btn ${o.length?'busy':''}" data-mesa="${m}" aria-pressed="${draft.mesa===m}"><b>${m}</b><small>${o.length?`${o.length} comanda${o.length>1?'s':''} · ${eur(t)}`:'Libre'}</small></button>`; }).join("")}</div>`;
  const lines = Object.entries(draft.lines).filter(([,q])=>q>0);
  const total = lines.reduce((s,[id,q])=>s+item(id).p*q,0);
  let box;
  if(draft.stage==="menu"){
    box = `<div class="order stack" id="orderBox">
      <h3>Nueva comanda · ${esc(draft.mesa)}</h3>
      ${lines.length? lines.map(([id,q])=>{const it=item(id); return `<div class="order-line"><div class="qty"><button type="button" data-qty="${id}" data-d="-1" aria-label="Quitar uno">−</button><b>${q}</b><button type="button" data-qty="${id}" data-d="1" aria-label="Añadir uno">+</button></div><div>${esc(it.n)} <span class="muted" style="font-size:.8rem">→ ${it.st==="barra"?"Barra":"Cocina"}</span><input type="text" data-nota="${id}" value="${esc(draft.notas[id]||"")}" placeholder="Observación: punto, temperatura…" style="min-height:40px;margin-top:4px;font-size:.9rem;padding:6px 10px"></div><span class="price">${eur(it.p*q)}</span></div>`}).join("") : `<p class="muted">Toca + en la carta para añadir lo que pide el cliente.</p>`}
      <div class="row" style="justify-content:space-between"><b>Total: ${eur(total)}</b><button type="button" class="btn" id="toAllergens" ${lines.length?'':'disabled'}>Confirmar comanda</button></div>
    </div>`;
  } else if(draft.stage==="ask"){
    box = `<div class="order stack" id="orderBox"><h3>Antes de enviar</h3>
      <p class="quote">¿Habéis preguntado si alguien tiene alergias o intolerancias?</p>
      <div class="options">
        <button type="button" class="option" data-ask="no-alergias">Sí, y nadie tiene alergias.</button>
        <button type="button" class="option" data-ask="alergias">Sí, y hay alguna alergia.</button>
        <button type="button" class="option" data-ask="no">No hemos preguntado.</button>
      </div></div>`;
  } else if(draft.stage==="which"){
    box = `<div class="order stack" id="orderBox"><h3>¿Qué alergia tiene el cliente?</h3>
      <div class="chips">${ALERGENOS.map(a=>`<button type="button" class="chip" data-allergy="${a}" aria-pressed="${draft.allergies.includes(a)}">${a}</button>`).join("")}</div>
      <button type="button" class="btn" id="checkAllergy" ${draft.allergies.length?'':'disabled'}>Revisar la comanda</button></div>`;
  } else {
    const risky = lines.map(([id])=>item(id)).filter(it=>it.a.some(a=>draft.allergies.includes(a)));
    let msg;
    if(draft.asked==="no") msg = `<div class="note bad"><b>Preguntad siempre por las alergias antes de enviar la comanda.</b> Volved con el cliente y repetid la comanda en voz alta.</div>`;
    else if(risky.length) msg = `<div class="note bad"><b>¡Cuidado!</b> ${risky.map(r=>esc(r.n)).join(", ")} ${risky.length>1?'llevan':'lleva'} ${draft.allergies.join(", ").toLowerCase()}. Explicádselo al cliente y ofrecedle otra opción.</div>`;
    else if(draft.asked==="alergias") msg = `<div class="note ok"><b>Bien hecho.</b> Nada lleva ${draft.allergies.join(", ").toLowerCase()}. La alergia irá marcada en la nota de pedido de barra y cocina.</div>`;
    else msg = `<div class="note ok"><b>Bien hecho.</b> Repetid la comanda en voz alta y enviadla.</div>`;
    box = `<div class="order stack" id="orderBox"><h3>Comanda de ${esc(draft.mesa)}</h3>${msg}
      <label class="field"><span>Observaciones generales para barra y cocina</span><input type="text" id="obs" value="${esc(draft.obs)}" placeholder="Ej.: servir primero las bebidas"></label>
      <div class="row">${risky.length||draft.asked==="no"?`<button type="button" class="btn ghost" id="backToMenu">Corregir la comanda</button>`:''}<button type="button" class="btn" id="sendOrder">Enviar a barra y cocina</button></div></div>`;
  }
  const menu = Object.entries(CARTA).map(([g,list])=>`<div class="menu-group"><h3>${g}</h3>${list.map(it=>`<div class="item"><div>${esc(it.n)}<div class="tags">${allergenTags(it.a)}</div></div><span class="price">${eur(it.p)}</span><button type="button" class="add" data-add="${it.id}" aria-label="Añadir ${esc(it.n)}" ${draft.stage!=="menu"?'disabled':''}>+</button></div>`).join("")}</div>`).join("");
  const mesaOrders = openOrders(draft.mesa);
  const status = mesaOrders.length ? `<div class="card stack"><h3>Seguimiento de ${esc(draft.mesa)}</h3>${mesaOrders.map(o=>`<div class="stack" style="gap:6px"><div class="row"><b>Comanda nº ${o.n}</b><span class="muted">${hhmm(o.t)}</span></div>
      ${orderStations(o).map(st=>`<div class="row" style="justify-content:space-between"><span>${st==="barra"?"Barra":"Cocina"}: ${o.lines.filter(l=>lineStation(l)===st).map(l=>`${l.q}× ${esc(item(l.pid).n)}`).join(", ")}</span><span class="row"><span class="state ${o.st[st]}">${stateLabel(o.st[st])}</span>${o.st[st]==="listo"?`<button type="button" class="btn small" data-served="${o.id}" data-st="${st}">Recoger y servir</button>`:''}</span></div>`).join("")}</div>`).join("<hr style='border:0;border-top:1px solid var(--line);width:100%'>")}
      <button type="button" class="btn ghost" data-goto="caja">El cliente pide la cuenta</button></div>` : "";
  return `<div><div class="eyebrow">Fase B · Sala</div><h2>Toma de comandas</h2></div>
    <p>Elegid la mesa, tomad la comanda y enviadla. Las bebidas van a barra y las comidas a cocina.</p>
    ${tables}
    <div class="split"><div class="stack">${box}${status}</div><div class="stack" style="gap:12px">${menu}</div></div>`;
}

/* ---------- Barra y cocina (notas de pedido) ---------- */
function vStation(st){
  const list = S.orders.filter(o=>o.st[st] && o.st[st]!=="servido").sort((a,b)=>a.t-b.t);
  const next = {nuevo:["recibido","Marcar recibida"], recibido:["prep","Empezar a preparar"], prep:["listo","Lista para pase"]};
  const done = S.orders.filter(o=>o.st[st]==="servido").length;
  return `<div><div class="eyebrow">Fase B · ${st==="barra"?"Barra":"Cocina / pase"}</div><h2>Notas de pedido de ${st==="barra"?"barra":"cocina"}</h2></div>
    <p>Atended primero las más antiguas. Marcad cada estado según avancéis para que sala sepa cuándo recoger.</p>
    ${list.length?`<div class="queue">${list.map(o=>{ const ls=o.lines.filter(l=>lineStation(l)===st); const s=o.st[st];
      return `<article class="ticket st-${s}"><header><b>${esc(o.mesa)}</b><span class="muted">Nº ${o.n} · ${hhmm(o.t)} · hace ${mins(o.t)} min</span></header>
        <ul>${ls.map(l=>`<li><b>${l.q}×</b> ${esc(item(l.pid).n)}${l.nota?` <i>(${esc(l.nota)})</i>`:''}</li>`).join("")}</ul>
        ${o.allergies&&o.allergies.length?`<div class="obs">Alergia: ${o.allergies.map(esc).join(", ")}</div>`:''}
        ${o.obs?`<div class="muted">Obs.: ${esc(o.obs)}</div>`:''}
        <div class="row" style="justify-content:space-between"><span class="state ${s}">${stateLabel(s)}</span>${next[s]?`<button type="button" class="btn small" data-adv="${o.id}" data-st="${st}" data-to="${next[s][0]}">${next[s][1]}</button>`:'<span class="muted">Esperando a sala</span>'}</div>
      </article>`; }).join("")}</div>`:`<div class="card"><p>No hay notas de pedido pendientes. ${done?`Ya habéis servido ${done}.`:'Cuando sala envíe una comanda aparecerá aquí.'}</p></div>`}`;
}

/* ---------- Caja (facturación y cobro) ---------- */
function startPay(mesa){
  const orders = openOrders(mesa); if(!orders.length) return;
  pay = {mesa, total:mesaTotal(mesa), tipo:"simplificada", cliente:{nombre:"",nif:"",dir:""}, checked:false, pagos:[], method:null, cashGiven:0, cashAmt:"", changeIn:"", changeOk:null, pos:null, partes:1, forceDeny:false};
}
const paid = () => r2(pay.pagos.reduce((s,p)=>s+p.importe,0));
const left = () => r2(pay.total - paid());
function receipt(tk){
  const ivs = ivaSplit(tk.total);
  return `<div class="receipt" aria-label="Tique">
    <div style="text-align:center"><b>${esc(EMPRESA.nombre)}</b><br>NIF ${esc(EMPRESA.nif)}<br>${esc(EMPRESA.dir)}</div><hr>
    <div class="r"><span>${tk.tipo==="completa"?"FACTURA":"FACTURA SIMPLIFICADA"} Nº ${esc(tk.num)}</span></div>
    <div class="r"><span>${fmtDate(tk.fecha)} ${tk.hora}</span><span>${esc(tk.mesa)}</span></div>
    ${tk.tipo==="completa"?`<hr><div>Cliente: ${esc(tk.cliente.nombre)}<br>NIF: ${esc(tk.cliente.nif)}<br>${esc(tk.cliente.dir)}</div>`:''}<hr>
    ${tk.lines.map(l=>`<div class="r"><span>${l.q} ${esc(l.n)}</span><span>${eur(l.imp)}</span></div>`).join("")}<hr>
    <div class="r"><span>Base imponible</span><span>${eur(ivs.base)}</span></div>
    <div class="r"><span>IVA 10 %</span><span>${eur(ivs.iva)}</span></div>
    <div class="r"><b>TOTAL</b><b>${eur(ivs.total)}</b></div>
    ${tk.pagos?`<hr>${tk.pagos.map(p=>`<div class="r"><span>${p.medio==="efectivo"?"Efectivo":"Tarjeta"}</span><span>${eur(p.importe)}</span></div>${p.medio==="efectivo"?`<div class="r"><span>&nbsp;Entregado / Cambio</span><span>${eur(p.entregado)} / ${eur(p.cambio)}</span></div>`:`<div class="r"><span>&nbsp;Tarjeta **** ${p.last4} · Aut. ${p.aut}</span></div>`}`).join("")}`:''}
    <hr><div style="text-align:center">Gracias por su visita</div></div>`;
}
function vCaja(){
  if(!pay){
    const busy = MESAS.filter(m=>openOrders(m).length);
    return `<div><div class="eyebrow">Fase C · Caja</div><h2>Facturación y cobro</h2></div>
      ${busy.length?`<p>Elegid la mesa que pide la cuenta.</p><div class="tables">${busy.map(m=>{ const o=openOrders(m); const unserved=o.some(x=>Object.values(x.st).some(v=>v!=="servido"));
        return `<button type="button" class="table-btn busy" data-paymesa="${m}"><b>${m}</b><small>${eur(mesaTotal(m))}${unserved?' · sin servir todo':''}</small></button>`; }).join("")}</div>`
      :`<div class="card"><p>No hay ninguna cuenta abierta.</p></div>`}
      ${S.tickets.length?`<h3>Tiques emitidos</h3><div class="table-wrap"><table><thead><tr><th>Nº</th><th>Hora</th><th>Mesa</th><th>Tipo</th><th>Pago</th><th>Total</th></tr></thead><tbody>${S.tickets.slice().reverse().map(t=>`<tr><td>${esc(t.num)}</td><td>${t.hora}</td><td>${esc(t.mesa)}</td><td>${t.tipo==="completa"?"Completa":"Simplificada"}</td><td>${[...new Set(t.pagos.map(p=>p.medio==="efectivo"?"Efectivo":"Tarjeta"))].join(" + ")}</td><td class="num">${eur(t.total)}</td></tr>`).join("")}</tbody></table></div>`:''}`;
  }
  const preview = {num:"(borrador)", fecha:today(), hora:hhmm(Date.now()), mesa:pay.mesa, tipo:pay.tipo, cliente:pay.cliente, lines:aggLines(openOrders(pay.mesa)), total:pay.total, pagos:pay.pagos.length?pay.pagos:null};
  const unserved = openOrders(pay.mesa).some(x=>Object.values(x.st).some(v=>v!=="servido"));
  let step;
  if(!pay.checked){
    step = `<div class="card stack"><h3>1. Tipo de documento</h3>
      <div class="chips">${[["simplificada","Factura simplificada (tique)"],["completa","Factura completa"]].map(([k,n])=>`<button type="button" class="chip" data-tipo="${k}" aria-pressed="${pay.tipo===k}">${n}</button>`).join("")}</div>
      ${pay.tipo==="completa"?`<div class="grid2"><label class="field"><span>Nombre o razón social</span><input type="text" id="cNombre" value="${esc(pay.cliente.nombre)}"></label><label class="field"><span>NIF</span><input type="text" id="cNif" value="${esc(pay.cliente.nif)}"></label></div><label class="field"><span>Domicilio</span><input type="text" id="cDir" value="${esc(pay.cliente.dir)}"></label>`:''}
      <h3>2. Revisad el tique con lo consumido</h3>
      ${unserved?`<div class="note bad">Ojo: esta mesa tiene productos que aún no constan como servidos.</div>`:''}
      <label class="check"><input type="checkbox" id="chkTicket"><span>He comprobado con el cliente que el tique coincide con lo que ha consumido.</span></label>
      <button type="button" class="btn" id="toPay">Pasar al cobro</button></div>`;
  } else if(left()>0){
    const parts = pay.partes>1 ? r2(pay.total/pay.partes) : null;
    let method = "";
    if(pay.method==="efectivo"){
      const amt = num(pay.cashAmt||left());
      method = `<div class="card stack"><h3>Cobro en efectivo</h3>
        <label class="field"><span>Importe que se cobra en efectivo</span><input type="text" inputmode="decimal" id="cashAmt" value="${esc(pay.cashAmt||String(left()).replace(".",","))}"></label>
        <div class="field"><span>El cliente entrega: <b>${eur(pay.cashGiven)}</b></span>
          <div class="money">${[50,20,10,5].map(v=>`<button type="button" class="bill" data-cash="${v}">${v} €</button>`).join("")}${[2,1,0.5,0.2,0.1,0.05].map(v=>`<button type="button" data-cash="${v}">${eur(v).replace(",00","")}</button>`).join("")}<button type="button" data-cash="0" data-clear="1">Borrar</button></div></div>
        <label class="field"><span>Cambio que vais a devolver (€)</span><input type="text" inputmode="decimal" id="changeIn" value="${esc(pay.changeIn)}" placeholder="Calculadlo vosotros"></label>
        ${pay.changeOk===false?`<div class="note bad">El cambio no es correcto. Restad: entregado ${eur(pay.cashGiven)} − importe ${isNaN(amt)?"?":eur(amt)}. Contadlo en voz alta.</div>`:''}
        <div class="row"><button type="button" class="btn" id="cashOk">Comprobar y cobrar</button><button type="button" class="btn ghost" data-method="">Cambiar medio de pago</button></div></div>`;
    } else if(pay.method==="tarjeta"){
      const amt = num(pay.cardAmt||left());
      const P = pay.pos||{stage:"idle"};
      let screen, keys="", acts="";
      if(P.stage==="idle"){ screen=`<span>IMPORTE</span><b>${eur(amt)}</b><span>Acerque o inserte tarjeta</span>`;
        acts=`<button type="button" data-pos="contactless">Acercar tarjeta (sin contacto)</button><button type="button" data-pos="chip">Insertar tarjeta</button>`; }
      else if(P.stage==="pin"){ screen=`<span>${eur(amt)}</span><b>PIN: ${"•".repeat(P.pin.length)}${"_".repeat(4-P.pin.length)}</b><span>${P.why||"Introduzca su PIN"}</span>`;
        keys=`<div class="keys">${[1,2,3,4,5,6,7,8,9].map(k=>`<button type="button" data-pin="${k}">${k}</button>`).join("")}<button type="button" class="ko" data-pin="C">Borrar</button><button type="button" data-pin="0">0</button><button type="button" class="ok" data-pin="OK">OK</button></div>`; }
      else if(P.stage==="ok"){ screen=`<b>ACEPTADA</b><span>Aut. ${P.aut} · **** ${P.last4}</span><span>Retire la tarjeta</span>`;
        acts=`<button type="button" data-pos="receipt">Entregar comprobante y registrar el pago</button>`; }
      else { screen=`<b>DENEGADA</b><span>Operación no autorizada</span>`;
        acts=`<button type="button" data-pos="retry">Probar con otra tarjeta</button><button type="button" data-method="efectivo">Ofrecer pago en efectivo</button>`; }
      method = `<div class="card stack"><h3>Cobro con tarjeta</h3>
        <label class="field"><span>Importe que se cobra con tarjeta</span><input type="text" inputmode="decimal" id="cardAmt" value="${esc(pay.cardAmt||String(left()).replace(".",","))}" ${P.stage!=="idle"?'disabled':''}></label>
        <div class="pos" role="group" aria-label="Datáfono de prácticas"><div class="screen">${screen}</div>${keys}<div class="actions">${acts}</div></div>
        <label class="check" style="max-width:420px"><input type="checkbox" id="forceDeny" ${pay.forceDeny?'checked':''}><span>Practicar tarjeta denegada: el datáfono rechazará el pago.</span></label>
        <button type="button" class="btn ghost" data-method="">Cambiar medio de pago</button></div>`;
    } else {
      method = `<div class="card stack"><h3>3. Medio de pago</h3>
        <div class="row"><button type="button" class="btn" data-method="efectivo">Efectivo</button><button type="button" class="btn" data-method="tarjeta">Tarjeta</button></div>
        <div class="field"><span>¿Pagan por separado?</span><div class="chips">${[1,2,3,4].map(n=>`<button type="button" class="chip" data-partes="${n}" aria-pressed="${pay.partes===n}">${n===1?"Todo junto":n+" personas"}</button>`).join("")}</div></div>
        ${parts?`<div class="note">Cada persona paga <b>${eur(parts)}</b>${r2(parts*pay.partes)!==pay.total?` (la última, ${eur(r2(pay.total-parts*(pay.partes-1)))}, por el redondeo)`:''}. Cobrad cada parte por separado con su medio de pago.</div>`:''}
        <p class="muted">Para un pago mixto, cobrad primero una parte en efectivo y el resto con tarjeta.</p></div>`;
    }
    step = `<div class="note"><b>Pendiente de cobro: ${eur(left())}</b>${pay.pagos.length?` · ya cobrado ${eur(paid())}`:''}</div>${method}`;
  } else {
    step = `<div class="note ok"><b>Cuenta cobrada.</b> Entregad el tique al cliente.</div><button type="button" class="btn" id="closeTicket">Cerrar la cuenta y emitir el tique</button>`;
  }
  return `<div><div class="eyebrow">Fase C · Caja</div><h2>Cuenta de ${esc(pay.mesa)} · ${eur(pay.total)}</h2></div>
    <div class="split"><div class="stack">${step}<button type="button" class="btn ghost" id="cancelPay" ${pay.pagos.length?'disabled':''}>Volver a la caja</button></div><div>${receipt(preview)}</div></div>`;
}

/* ---------- Cierre y arqueo ---------- */
function cashIn(){ return r2(S.tickets.reduce((s,t)=>s+t.pagos.filter(p=>p.medio==="efectivo").reduce((a,p)=>a+p.importe,0),0)); }
function cardIn(){ return r2(S.tickets.reduce((s,t)=>s+t.pagos.filter(p=>p.medio==="tarjeta").reduce((a,p)=>a+p.importe,0),0)); }
function vCierre(){
  const open = MESAS.filter(m=>openOrders(m).length);
  const esperado = r2(S.caja + cashIn());
  const A = S.arqueo;
  return `<div><div class="eyebrow">Fase D</div><h2>Postservicio, arqueo y cierre</h2></div>
    ${open.length?`<div class="note bad">Quedan cuentas abiertas: ${open.join(", ")}. Cobradlas antes de cerrar la caja.</div>`:''}
    <div class="card stack"><h3>Arqueo de caja</h3>
      <div class="kv"><span>Cambio inicial</span><b>${eur(S.caja)}</b><span>Cobrado en efectivo</span><b>${eur(cashIn())}</b><span>Cobrado con tarjeta (datáfono)</span><b>${eur(cardIn())}</b><span>Tiques emitidos</span><b>${S.tickets.length}</b><span>Total facturado</span><b>${eur(cashIn()+cardIn())}</b></div>
      <label class="field"><span>Efectivo que hay en la caja al contarlo (€)</span><input type="text" inputmode="decimal" id="contado" value="${A?String(A.contado).replace(".",","):""}" placeholder="Contad billetes y monedas"></label>
      <button type="button" class="btn" id="doArqueo">Hacer el arqueo</button>
      ${A?(A.diff===0?`<div class="note ok"><b>La caja cuadra.</b> Hay ${eur(A.contado)}, justo lo esperado (${eur(A.esperado)}).</div>`:`<div class="note bad"><b>Descuadre de ${eur(Math.abs(A.diff))}</b> ${A.diff>0?"de más":"de menos"}. Esperado ${eur(A.esperado)}, contado ${eur(A.contado)}. Revisad los cambios entregados y los tiques.</div>`):''}
    </div>
    <h3>Cierre del puesto</h3>${bar(S.d.length,FASE_D.length)}${checklist(FASE_D,S.d,"d")}
    <div class="next"><span></span><button type="button" class="btn" data-goto="resumen">Ver el resumen y cerrar el servicio</button></div>`;
}

/* ---------- Métricas, resumen y código ---------- */
function metrics(){
  const by = rot => {
    const os = S.orders.filter(o=>o.rot===rot), ts = S.tickets.filter(t=>t.rot===rot);
    const stTimes = st => { const v=os.filter(o=>o.tm[st]&&o.tm[st].listo).map(o=>(o.tm[st].listo-o.t)/60000); return v.length? Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10 : null; };
    return {com:os.length, ask:os.filter(o=>o.asked!=="no").length, risk:os.filter(o=>o.risky).length,
      nb:os.filter(o=>o.st.barra).length, nc:os.filter(o=>o.st.cocina).length, tb:stTimes("barra"), tc:stTimes("cocina"),
      tk:ts.length, fc:ts.filter(t=>t.tipo==="completa").length, ef:ts.reduce((s,t)=>s+t.pagos.filter(p=>p.medio==="efectivo").length,0), tj:ts.reduce((s,t)=>s+t.pagos.filter(p=>p.medio==="tarjeta").length,0),
      ce:(S.cashErrRot||{})[rot]||0};
  };
  const tA = FASE_A.reduce((n,g)=>n+g.items.length,0);
  return {rots:Array.from({length:S.nRot},(_,i)=>by(i+1)), a:[S.a.length,tA], d:[S.d.length,FASE_D.length], 
    arq: S.arqueo ? S.arqueo.diff : null, open: MESAS.filter(m=>openOrders(m).length).length, den:S.cardDenied};
}
function b64urlEncode(str){ const bytes=new TextEncoder().encode(str); let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64urlDecode(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const bin=atob(s); return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))); }
function makeCode(){
  const m = metrics();
  const payload = {v:3, team:S.team, f:S.fecha, p:Object.fromEntries(S.groups.map(g=>[g.id, g.members])), m};
  return "LM3." + b64urlEncode(JSON.stringify(payload));
}
function readCode(text){
  const mt = String(text||"").match(/LM3\.([A-Za-z0-9_-]+)/);
  if(!mt) return null;
  try{ const p = JSON.parse(b64urlDecode(mt[1])); return p && p.v===3 ? p : null; }catch(e){ return null; }
}
function vResumen(){
  const m = metrics();
  const rotCard = (r,x) => `<div class="card stack"><h3>Servicio</h3><p class="muted">${whoLine()||"Sin alumnos"}</p>
    <div class="kv"><span>Comandas tomadas</span><b>${x.com}</b><span>Preguntaron por alérgenos</span><b>${x.ask}/${x.com}</b><span>Notas de barra · tiempo medio</span><b>${x.nb} · ${x.tb!=null?x.tb+" min":"–"}</b><span>Notas de cocina · tiempo medio</span><b>${x.nc} · ${x.tc!=null?x.tc+" min":"–"}</b><span>Tiques emitidos (facturas completas)</span><b>${x.tk} (${x.fc})</b><span>Cobros en efectivo / tarjeta</span><b>${x.ef} / ${x.tj}</b><span>Errores al calcular el cambio</span><b>${x.ce}</b></div></div>`;
  return `<div><div class="eyebrow">Resumen</div><h2>${S.team?esc(S.team):"Resumen del servicio"}</h2></div>
    <div class="stats">
      <div class="stat"><span class="muted">Fase A · Preparar</span><b>${m.a[0]}/${m.a[1]}</b></div>
      <div class="stat"><span class="muted">Arqueo</span><b>${m.arq==null?"–":m.arq===0?"Cuadra":eur(m.arq)}</b></div>
      <div class="stat"><span class="muted">Fase D · Cierre</span><b>${m.d[0]}/${m.d[1]}</b></div>
    </div>
    ${rotCard(1,m.rots[0])}
    <div class="card stack"><h3>Cerrar el servicio: código de resultados</h3>
      ${groupsReady()?`<p>Copiadlo y enviádselo a vuestro docente por WhatsApp o por correo.</p>
      <textarea id="codeBox" readonly rows="4" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;min-height:0">${esc(makeCode())}</textarea>
      <div class="row"><button type="button" class="btn" id="copyCode">Copiar código</button></div>`
      :`<div class="note bad">Para generar el código, escribid quién está en cada puesto en <b>Servicio</b>.</div><button type="button" class="btn ghost" data-goto="equipo">Ir a Servicio</button>`}
    </div>
    <div id="resetBox" class="confirm-row"><button type="button" class="btn ghost" id="resetAsk">Abrir un servicio nuevo</button></div>`;
}

/* ---------- Eventos del TPV ---------- */
function tpvClick(t){
  if(syncClick(t)) return true;
  if(t.dataset.go!=null){ S.step=+t.dataset.go; persist(); render(); window.scrollTo({top:0}); return true; }
  if(t.dataset.goto){ if(t.dataset.goto==="caja" && draft.mesa && openOrders(draft.mesa).length){ startPay(draft.mesa); } go(t.dataset.goto); return true; }
  // Equipo
  if(t.dataset.addmember){ const gid=t.dataset.addmember, i=document.querySelector(`[data-newmember="${gid}"]`), n=i.value.trim(); if(!n){ i.focus(); return true; } S.groups.find(g=>g.id===gid).members.push(n); share("cfg"); render(); document.querySelector(`[data-newmember="${gid}"]`).focus(); return true; }
  if(t.dataset.delmember){ S.groups.find(g=>g.id===t.dataset.delmember).members.splice(+t.dataset.i,1); share("cfg"); render(); return true; }
  // Sala
  if(t.dataset.mesa){ draft = blankDraft(t.dataset.mesa); render(); return true; }
  if(t.dataset.add){ draft.lines[t.dataset.add]=(draft.lines[t.dataset.add]||0)+1; render(); toast("Añadido: "+item(t.dataset.add).n); return true; }
  if(t.dataset.qty){ const id=t.dataset.qty; draft.lines[id]=Math.max(0,(draft.lines[id]||0)+ +t.dataset.d); render(); return true; }
  if(t.id==="toAllergens"){ draft.stage="ask"; render(); $("#orderBox").scrollIntoView({block:"nearest"}); return true; }
  if(t.dataset.ask){ draft.asked=t.dataset.ask; draft.allergies=[]; draft.stage = t.dataset.ask==="alergias" ? "which" : "result"; render(); return true; }
  if(t.dataset.allergy){ const a=t.dataset.allergy; draft.allergies = draft.allergies.includes(a)? draft.allergies.filter(x=>x!==a) : draft.allergies.concat(a); render(); return true; }
  if(t.id==="checkAllergy"){ draft.stage="result"; render(); return true; }
  if(t.id==="backToMenu"){ draft.stage="menu"; render(); return true; }
  if(t.id==="sendOrder"){
    const lines = Object.entries(draft.lines).filter(([,q])=>q>0).map(([pid,q])=>({pid,q,nota:(draft.notas[pid]||"").trim()}));
    const risky = lines.some(l=>item(l.pid).a.some(a=>draft.allergies.includes(a)));
    const st = {}, tm = {};
    lines.forEach(l=>{ const s=lineStation(l); st[s]="nuevo"; tm[s]={}; });
    const sent = draft; draft = blankDraft(draft.mesa);
    const btn = t; btn.disabled = true;
    nextCounter("nOrder").then(n=>{
    const id = uid();
    S.orders.push({id, n, mesa:sent.mesa, t:Date.now(), rot:S.rot, lines, obs:sent.obs.trim(), asked:sent.asked, allergies:sent.allergies, risky, st, tm, paid:false});
    share("order", id); const msg = Object.keys(st).map(s=>s==="barra"?"barra":"cocina").join(" y ");
    render(); toast("Comanda nº "+n+" enviada a "+msg);
    }).catch(()=>{ draft = sent; btn.disabled=false; toast("No se ha podido enviar. Revisa la conexión y vuelve a intentarlo."); });
    return true;
  }
  if(t.dataset.served){ const o=S.orders.find(x=>x.id===t.dataset.served); o.st[t.dataset.st]="servido"; o.tm[t.dataset.st].servido=Date.now(); share("order", o.id); render(); toast("Servido en "+o.mesa); return true; }
  // Barra / cocina
  if(t.dataset.adv){ const o=S.orders.find(x=>x.id===t.dataset.adv), st=t.dataset.st; o.st[st]=t.dataset.to; o.tm[st][t.dataset.to]=Date.now(); share("order", o.id); render(); return true; }
  // Caja
  if(t.dataset.paymesa){ startPay(t.dataset.paymesa); render(); return true; }
  if(t.id==="cancelPay"){ pay=null; render(); return true; }
  if(t.dataset.tipo){ pay.tipo=t.dataset.tipo; render(); return true; }
  if(t.id==="toPay"){
    if(!$("#chkTicket").checked){ toast("Comprobad primero el tique con el cliente."); return true; }
    if(pay.tipo==="completa" && (!pay.cliente.nombre.trim()||!pay.cliente.nif.trim()||!pay.cliente.dir.trim())){ toast("La factura completa necesita nombre, NIF y domicilio."); return true; }
    pay.checked=true; render(); return true;
  }
  if(t.dataset.partes){ pay.partes=+t.dataset.partes; render(); return true; }
  if(t.dataset.method!=null){ pay.method=t.dataset.method||null; pay.cashGiven=0; pay.changeIn=""; pay.changeOk=null; pay.cashAmt=""; pay.cardAmt=""; pay.pos=null; render(); return true; }
  if(t.dataset.cash!=null){ pay.cashGiven = t.dataset.clear ? 0 : r2(pay.cashGiven + +t.dataset.cash); pay.changeOk=null; render(); return true; }
  if(t.id==="cashOk"){
    const amt = num(pay.cashAmt||left()), ch = num(pay.changeIn);
    if(isNaN(amt)||amt<=0||amt>left()){ toast("Revisad el importe en efectivo: como mucho "+eur(left())+"."); return true; }
    if(pay.cashGiven<amt){ toast("El cliente aún no ha entregado suficiente."); return true; }
    if(isNaN(ch)){ toast("Escribid el cambio que vais a devolver."); return true; }
    const real = r2(pay.cashGiven-amt);
    if(ch!==real){ const rot=S.rot; bump("cashErr/"+rot, ()=>{ S.cashErrRot=S.cashErrRot||{}; S.cashErrRot[rot]=(S.cashErrRot[rot]||0)+1; }); pay.changeOk=false; render(); return true; }
    pay.pagos.push({medio:"efectivo", importe:amt, entregado:pay.cashGiven, cambio:real});
    pay.method=null; pay.cashGiven=0; pay.changeIn=""; pay.changeOk=null; pay.cashAmt="";
    render(); toast("Cambio correcto: "+eur(real)+". Contadlo en voz alta al entregarlo."); return true;
  }
  if(t.dataset.pos){
    const amt = num(pay.cardAmt||left());
    if(t.dataset.pos==="contactless"||t.dataset.pos==="chip"){
      if(isNaN(amt)||amt<=0||amt>left()){ toast("Revisad el importe con tarjeta: como mucho "+eur(left())+"."); return true; }
      pay.cardAmt = String(amt).replace(".",",");
      const needPin = t.dataset.pos==="chip" || amt>50;
      pay.pos = needPin ? {stage:"pin", pin:"", why: t.dataset.pos==="chip"?"Introduzca su PIN":"Importe superior a 50 €: introduzca su PIN"} : resolveCard();
      render(); return true;
    }
    if(t.dataset.pos==="retry"){ pay.pos={stage:"idle"}; pay.forceDeny=false; render(); return true; }
    if(t.dataset.pos==="receipt"){ pay.pagos.push({medio:"tarjeta", importe:amt, last4:pay.pos.last4, aut:pay.pos.aut}); pay.method=null; pay.pos=null; pay.cardAmt=""; render(); toast("Pago con tarjeta registrado."); return true; }
  }
  if(t.dataset.pin!=null){
    const P = pay.pos;
    if(t.dataset.pin==="C") P.pin="";
    else if(t.dataset.pin==="OK"){ if(P.pin.length<4){ P.why="El PIN tiene 4 cifras"; } else { pay.pos=resolveCard(); } }
    else if(P.pin.length<4) P.pin+=t.dataset.pin;
    render(); return true;
  }
  if(t.id==="closeTicket"){
    const orders = openOrders(pay.mesa), P = pay; t.disabled = true;
    nextCounter("nTicket").then(n=>{
    const tk = {id:uid(), num:`T${String(n).padStart(4,"0")}`, fecha:today(), hora:hhmm(Date.now()), mesa:P.mesa, tipo:P.tipo, cliente:P.cliente, lines:aggLines(orders), total:P.total, pagos:P.pagos, rot:S.rot};
    S.tickets.push(tk); share("ticket", tk.id); orders.forEach(o=>{ o.paid=true; share("order", o.id); });
    pay=null; render(); toast("Tique "+tk.num+" emitido. Mesa libre.");
    }).catch(()=>{ t.disabled=false; toast("No se ha podido emitir el tique. Revisa la conexión."); });
    return true;
  }
  // Cierre
  if(t.id==="doArqueo"){ const c=num($("#contado").value); if(isNaN(c)){ toast("Escribid el efectivo contado."); return true; } const e=r2(S.caja+cashIn()); S.arqueo={contado:c, esperado:e, diff:r2(c-e)}; share("arqueo"); render(); return true; }
  // Resumen
  if(t.id==="copyCode"){ const box=$("#codeBox");
    try{ navigator.clipboard.writeText(box.value).then(()=>toast("Código copiado. Pegadlo en un mensaje a vuestro docente."), ()=>{ box.focus(); box.select(); toast("Mantened pulsado el código y elegid Copiar."); }); }
    catch(e){ box.focus(); box.select(); toast("Mantened pulsado el código y elegid Copiar."); } return true; }
  if(t.id==="resetAsk"){ $("#resetBox").innerHTML=`<span>${SYNC.on?"¿Habéis enviado el código? Este dispositivo saldrá de la sesión y empezará un servicio nuevo vacío.":"¿Habéis enviado el código? Se borrará este servicio y empezará uno nuevo vacío."}</span><button type="button" class="btn danger" id="resetYes">Sí, servicio nuevo</button><button type="button" class="btn ghost" id="resetNo">No</button>`; return true; }
  if(t.id==="resetYes"){ if(SYNC.on) disconnect(); S=FRESH(); draft=blankDraft("Mesa 1"); pay=null; persist(); render(); return true; }
  if(t.id==="resetNo"){ render(); return true; }
  return false;
}
function resolveCard(){
  const deny = pay.forceDeny;
  if(deny){ bump("cardDenied", ()=>{ S.cardDenied=(S.cardDenied||0)+1; }); pay.forceDeny=false; return {stage:"ko"}; }
  return {stage:"ok", aut:String(Math.floor(100000+Math.random()*899999)), last4:String(Math.floor(1000+Math.random()*8999))};
}
function tpvChange(t){
  if(t.dataset && t.dataset.check){ const k=t.dataset.check; S[k] = t.checked ? S[k].concat(t.value) : S[k].filter(x=>x!==t.value); share(k); render(); return true; }
  if(t.id==="forceDeny"){ pay.forceDeny=t.checked; return true; }
  if(t.id==="cajaIni"){ const v=num(t.value); if(!isNaN(v)&&v>=0){ S.caja=v; share("cfg"); } else toast("Escribid el cambio inicial en euros, por ejemplo 100."); return true; }
  return false;
}
function tpvInput(t){
  if(t.id==="teamName"){ S.team=t.value.trim(); clearTimeout(tpvInput.h); tpvInput.h=setTimeout(()=>share("cfg"),600); persist(); return true; }
  if(t.dataset && t.dataset.nota){ draft.notas[t.dataset.nota]=t.value; return true; }
  if(t.id==="obs"){ draft.obs=t.value; return true; }
  if(t.id==="cNombre"){ pay.cliente.nombre=t.value; return true; }
  if(t.id==="cNif"){ pay.cliente.nif=t.value; return true; }
  if(t.id==="cDir"){ pay.cliente.dir=t.value; return true; }
  if(t.id==="cashAmt"){ pay.cashAmt=t.value; return true; }
  if(t.id==="changeIn"){ pay.changeIn=t.value; return true; }
  if(t.id==="cardAmt"){ pay.cardAmt=t.value; return true; }
  return false;
}
document.addEventListener("click", ev=>{
  const t = ev.target.closest("button"); if(!t) return;
  if(t.id==="modeStudent"){ mode="alumno"; render(); return; }
  if(t.id==="modeTeacher"){ mode="docente"; render(); return; }
  if(mode==="alumno") tpvClick(t); else if(typeof teacherClick==="function") teacherClick(t);
});
document.addEventListener("change", ev=>{ if(mode==="alumno") tpvChange(ev.target); else if(typeof teacherChange==="function") teacherChange(ev.target); });
document.addEventListener("input", ev=>{ if(mode==="alumno") tpvInput(ev.target); else if(typeof teacherInput==="function") teacherInput(ev.target); });
document.addEventListener("keydown", ev=>{ const g=ev.target.dataset&&ev.target.dataset.newmember; if(ev.key==="Enter" && g){ ev.preventDefault(); document.querySelector(`[data-addmember="${g}"]`).click(); } });
// Refresca los minutos de barra y cocina sin molestar si alguien está escribiendo
setInterval(()=>{ if(mode==="alumno" && ["barra","cocina"].includes(STEPS[S.step][0]) && !document.activeElement.matches("input,textarea,select")) render(); }, 30000);

/* ---------- Sincronización entre dispositivos (Firebase Realtime Database) ---------- */
const FIREBASE_CONFIG = window.MORERAS_FIREBASE || null;
let L = Object.assign({code:"", puesto:"todo"}, load("moreras-device", {}));
const saveL = () => save("moreras-device", L);
const SYNC = {on:false, db:null, ref:null, status:"off", pendingRender:false};
const PUESTOS = {todo:["Todo en este dispositivo","Servicio, preparación, sala, barra, cocina, caja y cierre"], sala:["Comandero de sala","Toma de comandas y caja"], barra:["TPV de barra","Notas de pedido de bebidas"], cocina:["TPV de cocina","Notas de pedido de comidas"]};
const STEPS_BY_PUESTO = {todo:null, sala:["sala","caja"], barra:["barra"], cocina:["cocina"]};
const firebaseReady = () => !!(FIREBASE_CONFIG && window.firebase && firebase.database);

function normOrder(o){
  o.lines = o.lines||[]; o.allergies = o.allergies||[]; o.st = o.st||{}; o.tm = o.tm||{};
  Object.keys(o.st).forEach(s=>{ o.tm[s]=o.tm[s]||{}; }); o.obs=o.obs||""; o.paid=!!o.paid; return o;
}
function applyRemote(v){
  v = v||{};
  const cfg = v.cfg||{};
  S.team = cfg.team||""; S.nRot = 1; S.rot = cfg.rot||1; S.caja = cfg.caja!=null?cfg.caja:100; S.fecha = cfg.fecha||S.fecha;
  S.groups = (cfg.groups||freshGroups()).map(g=>({id:g.id, name:g.name, members:g.members||[], roles:g.roles||{}}));
  S.a = v.a||[]; S.d = v.d||[]; S.arqueo = v.arqueo||null;
  S.orders = Object.values(v.orders||{}).map(normOrder).sort((a,b)=>a.t-b.t);
  S.tickets = Object.values(v.tickets||{}).map(t=>Object.assign({pagos:[], lines:[], cliente:{}}, t)).sort((a,b)=>a.num.localeCompare(b.num));
  S.cashErrRot = v.cashErr||{}; S.cardDenied = v.cardDenied||0; S.nOrder = v.nOrder||0; S.nTicket = v.nTicket||0;
  persist();
  const a = document.activeElement;
  if(a && a.matches && a.matches("input,textarea,select")){ SYNC.pendingRender=true; return; }
  render();
}
document.addEventListener("focusout", ()=>{ if(SYNC.pendingRender){ SYNC.pendingRender=false; setTimeout(()=>{ const a=document.activeElement; if(!(a&&a.matches&&a.matches("input,textarea,select"))) render(); else SYNC.pendingRender=true; }, 50); } });

function connect(code){
  if(!firebaseReady()){ toast("La conexión entre dispositivos no está disponible. Revisa internet."); return false; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    SYNC.db = firebase.database();
    if(SYNC.ref) SYNC.ref.off();
    SYNC.ref = SYNC.db.ref("s/"+code);
    SYNC.on = true; L.code = code; saveL();
    SYNC.db.ref(".info/connected").on("value", s=>{ SYNC.status = s.val() ? "ok" : "lost"; const b=$("#syncDot"); if(b) b.dataset.state=SYNC.status; });
    SYNC.ref.on("value", snap=>applyRemote(snap.val()), err=>{ toast("No se puede leer la sesión: "+(err&&err.code||"error")); });
    return true;
  }catch(e){ toast("No se ha podido conectar."); return false; }
}
function disconnect(){ if(SYNC.ref) SYNC.ref.off(); SYNC.on=false; SYNC.ref=null; L.code=""; L.puesto="todo"; saveL(); }
function newCode(){ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c=""; for(let i=0;i<5;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }
function cfgOf(){ return {team:S.team, nRot:S.nRot, rot:S.rot, caja:S.caja, fecha:S.fecha, groups:S.groups.map(g=>({id:g.id,name:g.name,members:g.members,roles:g.roles}))}; }
async function createSession(){
  if(!firebaseReady()){ toast("La conexión entre dispositivos no está disponible. Revisa internet."); return; }
  const code = newCode();
  if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  const clean = v => JSON.parse(JSON.stringify(v));
  const orders = {}; S.orders.forEach(o=>orders[o.id]=clean(o));
  const tickets = {}; S.tickets.forEach(t=>tickets[t.id||t.num]=clean(Object.assign({id:t.id||t.num},t)));
  try{
    await firebase.database().ref("s/"+code).set({creado:Date.now(), cfg:cfgOf(), a:S.a, d:S.d, arqueo:S.arqueo, orders, tickets, nOrder:S.nOrder, nTicket:S.nTicket, cashErr:S.cashErrRot||{}, cardDenied:S.cardDenied||0});
  }catch(e){ toast("No se ha podido crear la sesión. Revisa internet."); return; }
  connect(code); toast("Sesión "+code+" creada"); render();
}
async function joinSession(code){
  code = String(code||"").trim().toUpperCase();
  if(!/^[A-Z0-9]{5}$/.test(code)){ toast("El código de sesión tiene 5 caracteres."); return; }
  if(!firebaseReady()){ toast("La conexión entre dispositivos no está disponible. Revisa internet."); return; }
  if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  try{ const s = await firebase.database().ref("s/"+code+"/creado").get(); if(!s.exists()){ toast("No existe ninguna sesión con el código "+code+"."); return; } }
  catch(e){ toast("No se ha podido comprobar la sesión. Revisa internet."); return; }
  connect(code); toast("Conectado a la sesión "+code); render();
}

/* Escritura: en local guarda en el navegador; conectado, escribe solo la parte cambiada */
const clean = v => v===undefined ? null : JSON.parse(JSON.stringify(v));
function share(part, id){
  persist();
  if(!SYNC.on) return;
  const r = SYNC.ref;
  if(part==="cfg") r.child("cfg").set(clean(cfgOf()));
  else if(part==="order"){ const o=S.orders.find(x=>x.id===id); if(o) r.child("orders/"+id).set(clean(o)); }
  else if(part==="ticket"){ const t=S.tickets.find(x=>x.id===id); if(t) r.child("tickets/"+id).set(clean(t)); }
  else r.child(part).set(clean(S[part]));
}
async function nextCounter(name){
  if(!SYNC.on){ S[name]=(S[name]||0)+1; persist(); return S[name]; }
  const res = await SYNC.ref.child(name).transaction(v=>(v||0)+1);
  return res.snapshot.val();
}
function bump(path, local){
  if(!SYNC.on){ local(); persist(); return; }
  SYNC.ref.child(path).transaction(v=>(v||0)+1);
}

function syncBar(){
  if(!SYNC.on) return "";
  const p = PUESTOS[L.puesto]||PUESTOS.todo;
  return `<div class="rotbar" style="justify-content:space-between;background:var(--brass-soft)"><span><span id="syncDot" data-state="${SYNC.status}" class="sync-dot"></span>Sesión <b>${esc(L.code)}</b> · ${esc(p[0])}</span><button type="button" class="btn small ghost" id="changePuesto">Cambiar puesto</button></div>`;
}
function vConexion(){
  if(!FIREBASE_CONFIG) return "";
  if(SYNC.on){
    return `<div class="card stack"><h3>Varios dispositivos</h3>
      <p>Este dispositivo está en la sesión <b style="font-size:1.4rem;letter-spacing:.12em">${esc(L.code)}</b>. Para conectar otro, abre la app en él, pulsa <b>Unirse con código</b> y escribe este código.</p>
      <div class="field"><span>¿Qué es este dispositivo?</span><div class="options">${Object.entries(PUESTOS).map(([k,[n,d]])=>`<button type="button" class="option ${L.puesto===k?'right':''}" data-puesto="${k}"><b>${n}</b><br><span class="muted">${d}</span></button>`).join("")}</div></div>
      <div id="leaveBox" class="confirm-row"><button type="button" class="btn ghost" id="leaveAsk">Salir de la sesión</button></div></div>`;
  }
  return `<div class="card stack"><h3>¿Vais a usar varios dispositivos?</h3>
    <p>Por ejemplo, un móvil como comandero y un ordenador en barra y otro en cocina. Uno crea la sesión y los demás se unen con su código. Necesitan conexión a internet.</p>
    <div class="row"><button type="button" class="btn" id="createSess">Crear sesión</button></div>
    <div class="row"><input type="text" id="joinCode" placeholder="Código, ej. K7P2Q" autocapitalize="characters" style="flex:1;min-width:0;text-transform:uppercase;letter-spacing:.1em"><button type="button" class="btn ghost" id="joinSess">Unirse con código</button></div></div>`;
}
function syncClick(t){
  if(t.id==="createSess"){ createSession(); return true; }
  if(t.id==="joinSess"){ joinSession($("#joinCode").value); return true; }
  if(t.dataset.puesto){ L.puesto=t.dataset.puesto; saveL(); const allowed=STEPS_BY_PUESTO[L.puesto]; if(allowed) S.step=STEPS.findIndex(s=>s[0]===allowed[0]); persist(); render(); toast("Este dispositivo es ahora: "+PUESTOS[L.puesto][0]); return true; }
  if(t.id==="changePuesto"){ S.step=0; persist(); render(); window.scrollTo({top:0}); return true; }
  if(t.id==="leaveAsk"){ $("#leaveBox").innerHTML=`<span>Este dispositivo dejará de recibir comandas. La sesión sigue en los demás.</span><button type="button" class="btn danger" id="leaveYes">Salir</button><button type="button" class="btn ghost" id="leaveNo">No</button>`; return true; }
  if(t.id==="leaveYes"){ disconnect(); render(); toast("Has salido de la sesión"); return true; }
  if(t.id==="leaveNo"){ render(); return true; }
  return false;
}

if(L.code && FIREBASE_CONFIG) connect(L.code);
render();
</script>
</body>
